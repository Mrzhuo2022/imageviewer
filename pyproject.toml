[project]
name = "pyside"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "evarle", email = ""},
]
dependencies = [
    "PySide6>=6.9.1", 
    "Pillow>=11.3.0", 
    "realesrgan>=0.3.0", 
    "torch==2.3.1+cu121", 
    "torchvision==0.18.1+cu121", 
    "psutil>=5.9.0",
    "numpy<2.0",
    "basicsr>=1.4.2",
    "facexlib>=0.3.0",
    "gfpgan>=1.3.8"
]
requires-python = ">=3.9"
readme = "README.md"
license = {text = "MIT"}


[tool.pdm]
distribution = false

[[tool.pdm.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu121"
verify_ssl = true
include_packages = ["torch", "torchvision", "torchaudio"]
